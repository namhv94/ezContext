[package]
name = "ezcontext"
version = "0.1.0"
edition = "2021"
authors = ["EzLabs Core Team <namhv@ezlabs.tech>"]
description = "AST Code-Skeleton & Token Saver MCP Server in Rust for AI coding assistants and VS Code."
license = "MIT"
repository = "https://github.com/namhv94/ezContext"
homepage = "https://ezlabs.tech"
keywords = ["mcp", "ast", "token-saver", "code-skeleton", "vscode", "ezlabs"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
thiserror = "1.0"
walkdir = "2.4"
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"

[[bin]]
name = "ezcontext"
path = "src/main.rs"

[lib]
name = "ezcontext"
path = "src/lib.rs"
